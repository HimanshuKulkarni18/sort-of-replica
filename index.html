<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Online Compiler Replica</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Online Python Compiler</h1>
        <div class="actions">
          <button id="runBtn" class="btn btn-primary">Run</button>
          <button id="clearBtn" class="btn">Clear Output</button>
        </div>
      </header>

      <main class="panes">
        <section class="pane editor-pane">
          <div class="pane-title">main.py</div>
          <textarea id="codeEditor" spellcheck="false"></textarea>
        </section>

        <section class="pane output-pane">
          <div class="pane-title">Output</div>
          <pre id="output"></pre>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
